name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kananshr13
          outputs: |
            dist/github-snake.svg?color_snake=#8B5CF6&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353
            dist/github-snake-dark.svg?color_snake=#A855F7&color_dots=#0D1117,#123524,#1B5E3A,#2E8B57,#4CAF50

      - name: Push snake files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
